name: Release Grayscale Everywhere
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release extension
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: $VERSION"
              exit 1
            fi

            VERSION="$VERSION" node -e '
              const fs = require("node:fs");
              const version = process.env.VERSION;
              for (const file of ["package.json", "manifest.json"]) {
                const json = JSON.parse(fs.readFileSync(file, "utf8"));
                json.version = version;
                fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
              }
            '

            RELEASE_TAG="v$VERSION"
          else
            RELEASE_TAG="$TAG_NAME"
            VERSION="${RELEASE_TAG#v}"
            VERSION="$VERSION" node -e '
              const fs = require("node:fs");
              const expected = process.env.VERSION;
              for (const file of ["package.json", "manifest.json"]) {
                const actual = JSON.parse(fs.readFileSync(file, "utf8")).version;
                if (actual !== expected) {
                  console.error(file + " has version " + actual + "; expected " + expected);
                  process.exit(1);
                }
              }
            '
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Build Chrome package
        run: >-
          bunx extension build
          --browser=chrome
          --polyfill
          --zip
          --zip-filename=grayscale-everywhere-extension-${RELEASE_TAG}-chrome.zip
          --silent

      - name: Build Firefox package
        run: >-
          bunx extension build
          --browser=firefox
          --zip
          --zip-source
          --zip-filename=grayscale-everywhere-extension-${RELEASE_TAG}-firefox.zip
          --silent

      - name: Submit Firefox package to AMO
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: >-
          bunx web-ext@10.6.0 sign
          --source-dir dist/firefox
          --api-key "$FIREFOX_JWT_ISSUER"
          --api-secret "$FIREFOX_JWT_SECRET"
          --channel listed
          --upload-source-code dist/grayscale-everywhere-${VERSION}-source.zip
          --artifacts-dir dist/amo
          --timeout 120000
          --approval-timeout 0

      - name: Commit version and create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:main
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/chrome/grayscale-everywhere-extension-${RELEASE_TAG}-chrome.zip
          dist/firefox/grayscale-everywhere-extension-${RELEASE_TAG}-firefox.zip
          --repo "${GITHUB_REPOSITORY}"
          --title "$RELEASE_TAG"
          --generate-notes
          --verify-tag
