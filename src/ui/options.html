<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grayscale Filter - Settings</title><link rel="stylesheet" href="ui.css"></head><body class="options-body"><div class="options-container"><header class="options-header"><div class="header-content"><h1>Grayscale Filter - Settings</h1></div></header><main class="options-content"><div id="feedback" class="feedback-message"></div><section class="settings-section"><h2>General</h2><div class="setting-row"><label class="toggle-label"><input type="checkbox" id="enableToggle"> <span class="toggle-text">Enable grayscale filter globally</span></label></div><div class="setting-row"><label class="toggle-label"><input type="checkbox" id="advancedTrackingToggle"> <span class="toggle-text">Enable advanced SPA tracking</span><div class="setting-description"><p class="hint">Improves filter behavior on dynamic websites that change content without page reload. Disable only if you experience performance issues.</p></div></label></div><div class="setting-row"><label for="intensitySlider" class="setting-label">Grayscale intensity: <span id="intensityValue">100</span>%</label> <input type="range" id="intensitySlider" min="0" max="100" step="5" value="100" class="intensity-slider"></div></section><section class="settings-section"><h2>Exclude List</h2><p class="section-description">Sites in this list will not have the grayscale filter applied. You can use domains (example.com) or wildcards (*.example.com).</p><form id="addExcludeForm" class="add-pattern-form"><input type="text" id="excludeInput" placeholder="example.com or *.domain.com" class="pattern-input" required> <button type="submit" class="btn btn-primary">Add</button></form><div class="exclude-list-container"><table id="excludeTable" class="exclude-table"><thead><tr><th>Pattern</th><th>Action</th></tr></thead><tbody id="excludeTableBody"></tbody></table></div></section><section class="settings-section"><h2>Import / Export</h2><p class="section-description">Backup or restore your settings as JSON.</p><div class="import-export-actions"><button id="exportBtn" class="btn btn-secondary">Export Settings</button> <button id="importBtn" class="btn btn-secondary">Import Settings</button></div></section></main><footer class="options-footer"><p>Created by <a href="https://github.com/Nubet" target="_blank">Nubet</a> with ❤️</p></footer></div><script src="../common/utils.js"></script><script src="options.js"></script></body></html>
