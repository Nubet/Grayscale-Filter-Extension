<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grayscale Filter</title>
    <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup-body">
<div class="popup-container">
    <header class="popup-header">
        <div class="header-content">
            <img src="../../assets/icon48.png" alt="" class="header-logo" />
            <h1>Grayscale Filter</h1>
        </div>
    </header>

    <div class="popup-content" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="settings-section" style="padding: 1rem;">
            <label class="toggle-label">
                <span class="toggle-text">Enable Filter</span>
                <input type="checkbox" id="enableToggle" />
            </label>
        </div>

        <div class="intensity-section">
            <label for="intensitySlider" class="intensity-label">
                <span>Intensity</span>
                <span id="intensityValue" style="font-family: monospace;">100%</span>
            </label>
            <input
                type="range"
                id="intensitySlider"
                min="0"
                max="100"
                step="5"
                value="100"
                class="intensity-slider"
            />

            <div class="color-preview-section">
                <div class="color-grid" id="colorGrid">
                    <div class="color-cell" data-color="red-intense"></div>
                    <div class="color-cell" data-color="orange-intense"></div>
                    <div class="color-cell" data-color="yellow-intense"></div>
                    <div class="color-cell" data-color="green-intense"></div>
                    <div class="color-cell" data-color="blue-intense"></div>
                    <div class="color-cell" data-color="purple-intense"></div>
                </div>
            </div>
        </div>

        <div class="current-site-section">
            <p class="site-label">Current Website</p>
            <p id="currentSite" class="site-name">loading...</p>
            <button id="toggleSiteBtn" class="btn btn-secondary btn-small btn-full-width">
                Exclude this site
            </button>
        </div>

        <div class="footer-links">
            <button id="manageBtn" class="btn-link">Open Settings</button>
        </div>
    </div>
</div>

<script src="../common/utils.js"></script>
<script src="popup.js"></script>
</body>
</html>
